<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <!-- Dark Boss Crimson Glows -->
    <radialGradient id="bossOuterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff0037" stop-opacity="0.45"/>
      <stop offset="65%" stop-color="#70001a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0a0104" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bossVisor" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#28030b"/>
      <stop offset="85%" stop-color="#0a0003"/>
    </radialGradient>
    <!-- Obsidian Carbon Armor Gradient -->
    <linearGradient id="armorDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d4452"/>
      <stop offset="35%" stop-color="#1e222a"/>
      <stop offset="75%" stop-color="#0f1115"/>
      <stop offset="100%" stop-color="#060709"/>
    </linearGradient>
    <linearGradient id="bossRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff003b"/>
      <stop offset="100%" stop-color="#ff3b69"/>
    </linearGradient>
    <!-- Filters -->
    <filter id="crimsonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="blazingRed" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur2"/>
      <feGaussianBlur stdDeviation="4" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bossShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#ff0033" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Ambient Pulsing Glow -->
  <circle cx="160" cy="160" r="148" fill="url(#bossOuterGlow)"/>

  <!-- Rotating Geometric Data Rings -->
  <circle cx="160" cy="160" r="130" fill="none" stroke="#ff0037" stroke-width="1.5" stroke-dasharray="14 10 4 10" opacity="0.4" filter="url(#crimsonBlur)"/>
  <circle cx="160" cy="160" r="110" fill="none" stroke="#a855f7" stroke-width="1.2" stroke-dasharray="8 8" opacity="0.35"/>

  <!-- Boss Cybernetic Horns / Antenna Array -->
  <path d="M 120,70 L 98,34 L 112,32 L 132,62 Z" fill="#252932" stroke="#ff003b" stroke-width="1.5" filter="url(#crimsonBlur)"/>
  <path d="M 200,70 L 222,34 L 208,32 L 188,62 Z" fill="#252932" stroke="#ff003b" stroke-width="1.5" filter="url(#crimsonBlur)"/>
  
  <path d="M 160,70 L 160,32" stroke="#475569" stroke-width="4.5" stroke-linecap="round"/>
  <polygon points="160,20 167,34 153,34" fill="#ff003b" filter="url(#blazingRed)"/>

  <!-- Side Vents / Armor Plates -->
  <polygon points="48,110 68,98 68,162 48,150" fill="#181b22" stroke="#ff003b" stroke-width="1.2" filter="url(#bossShadow)"/>
  <polygon points="272,110 252,98 252,162 272,150" fill="#181b22" stroke="#ff003b" stroke-width="1.2" filter="url(#bossShadow)"/>

  <!-- Main Head Chassis (Angular Boss Mecha Design) -->
  <polygon points="100,64 220,64 252,106 244,188 206,208 114,208 76,188 68,106" fill="url(#armorDark)" stroke="#374151" stroke-width="2.5" filter="url(#bossShadow)"/>

  <!-- Specular Highlights -->
  <polygon points="110,70 210,70 236,102 160,94 84,102" fill="#4b5563" opacity="0.45"/>

  <!-- Dark Armored Visor -->
  <polygon points="112,88 208,88 226,120 220,172 192,188 128,188 100,172 94,120" fill="url(#bossVisor)" stroke="#581c2b" stroke-width="2"/>

  <!-- Menacing Red Glowing Cyber Eyes -->
  <g filter="url(#blazingRed)">
    <!-- Angular Left Eye -->
    <polygon points="112,126 142,132 138,142 110,132" fill="#ff003b"/>
    <polygon points="116,128 138,133 134,138 114,133" fill="#ffffff"/>

    <!-- Angular Right Eye -->
    <polygon points="208,126 178,132 182,142 210,132" fill="#ff003b"/>
    <polygon points="204,128 182,133 186,138 206,133" fill="#ffffff"/>

    <!-- Sharp Center Sensor Core / Grid -->
    <line x1="146" y1="162" x2="174" y2="162" stroke="#ff003b" stroke-width="3" stroke-linecap="round"/>
    <circle cx="160" cy="162" r="3" fill="#ffffff"/>
  </g>

  <!-- Neck Link -->
  <rect x="142" y="206" width="36" height="14" rx="3" fill="#1e293b"/>
  <line x1="148" y1="213" x2="172" y2="213" stroke="#ff003b" stroke-width="2"/>

  <!-- Torso Upper Chassis -->
  <polygon points="90,220 230,220 214,264 106,264" fill="url(#armorDark)" stroke="#475569" stroke-width="1.8" filter="url(#bossShadow)"/>
  
  <!-- Pulsing Reactor Core in Chest -->
  <circle cx="160" cy="242" r="14" fill="#090104" stroke="#ff003b" stroke-width="2"/>
  <circle cx="160" cy="242" r="8" fill="#ff003b" filter="url(#blazingRed)"/>
  <circle cx="160" cy="242" r="3" fill="#ffffff"/>
</svg>
